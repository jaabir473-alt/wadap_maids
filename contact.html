<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wadap Maids | Book a Service</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

<div class="booking-container">
    <h2>Book Your Cleaning Service</h2>
    <p>Professional cleaning for Penang and Kedah households.</p>

    <form action="submit_booking.php" method="POST">
        
        <div class="form-group">
            <label for="customer_name">Full Name:</label>
            <input type="text" name="customer_name" id="customer_name" required placeholder="e.g. Ahmad Ali">
        </div>

        <div class="form-group">
            <label for="service_type">Type of Service:</label>
            <select name="service_type" id="service_type" required>
                <option value="">-- Select Service --</option>
                <option value="Basic Cleaning">Basic Cleaning (RM25/hr)</option>
                <option value="Deep Cleaning">Deep Cleaning (RM50/hr)</option>
                <option value="Office Cleaning">Office Cleaning</option>
            </select>
        </div>

        <div class="form-group">
            <label for="booking_date">Preferred Date:</label>
            <input type="date" name="booking_date" id="booking_date" required>
        </div>

        <div class="form-group">
            <label for="address">Full Address:</label>
            <textarea name="address" id="address" rows="3" required placeholder="Address in Penang or Kedah"></textarea>
        </div>

        <button type="submit" name="submit_booking" class="btn-submit">Confirm Booking</button>
    </form>
</div>

</body>
</html>
